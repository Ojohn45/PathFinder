# One command to run PathFinder with HTTPS-ready Caddy in front.
#   1. put your domain in the Caddyfile
#   2. docker compose up -d
services:
  pathfinder:
    build: .
    restart: unless-stopped
    env_file: .env
    volumes:
      - pathfinder-data:/app/storage
    expose:
      - "8080"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - pathfinder

volumes:
  pathfinder-data:
  caddy-data:
  caddy-config:
