<!DOCTYPE html>
<html data-theme="{{.Theme}}">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Log In - PathFinder</title>
    <link rel="stylesheet" href="/static/style.css">
    <link rel="icon" href="/favicon.ico" sizes="any">
    <link rel="icon" type="image/png" sizes="192x192" href="/static/icons/{{iconName}}-192.png">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">

</head>
<body class="auth-body" data-theme="base">
    <div class="auth-wrapper">
        <div class="auth-image">
            <div class="auth-brand">
                {{template "logo" .}}
                <p>Find your way to the right resource</p>
            </div>
        </div>
        <div class="auth-form-side">
            <div class="auth-box">
                <h1>Welcome Back</h1>
                <p class="auth-subtext">Log in to keep learning.</p>

                {{if .Created}}<p class="form-ok">Account created! Check your email, then log in.</p>{{end}}
                {{if .Error}}<p class="form-error">{{.Error}}</p>{{end}}

                <form method="POST" action="/login">
                    <label>Username, email or phone number</label>
                    <input type="text" name="username" value="{{.Username}}" autocomplete="username" required autofocus>

                    <label>Password</label>
                    <input type="password" name="password" autocomplete="current-password" required>

                    <button type="submit" class="btn-filled full-width">Log In</button>
                </form>

                <p class="auth-switch">
                    New here? <a href="/signup">Create an account</a>
                </p>
            </div>
        </div>
    </div>
    {{template "showpass"}}
</body>
</html>
