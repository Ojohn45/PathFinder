<!DOCTYPE html>
<html data-theme="{{.Theme}}">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Admin Log In - PathFinder</title>
    <link rel="stylesheet" href="/static/style.css">
    <link rel="icon" href="/favicon.ico" sizes="any">
    <link rel="icon" type="image/png" sizes="192x192" href="/static/icons/{{iconName}}-192.png">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">

</head>
<body class="auth-body" data-theme="base">
    <div class="back-float">{{template "backbtn" .}}</div>
    <div class="auth-wrapper">
        <div class="auth-image">
            <div class="auth-brand">
                {{template "logo" .}}
                <p>Find your way to the right resource</p>
            </div>
        </div>
        <div class="auth-form-side">
            <div class="auth-box">
                <h1>Admin Log In</h1>
                <p class="auth-subtext">For head admin Ken and invited admins.</p>

                {{if .Error}}<p class="form-error">{{.Error}}</p>{{end}}

                <form method="POST" action="/admin/login">
                    <label>Admin Username</label>
                    <input type="text" name="username" value="{{.Username}}" autocomplete="username" required autofocus>

                    <label>Password</label>
                    <input type="password" name="password" autocomplete="current-password" required>

                    <button type="submit" class="btn-filled full-width">Log In as Admin</button>
                </form>

                <p class="auth-switch">
                    <a href="/login">Back to normal log in</a>
                </p>
            </div>
        </div>
    </div>
    {{template "showpass"}}
</body>
</html>
